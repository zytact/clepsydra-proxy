name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release to build and publish when a release run failed. For example, v8.0.76-clepsydra.2.
        type: string
        required: true

env:
  GH_REPO: ${{ github.repository }}
  GO_VERSION: '1.26.10'

jobs:
  release-please:
    if: github.event_name == 'push'
    concurrency: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - id: release
        uses: googleapis/release-please-action@v5
        with:
          release-type: simple
          include-component-in-tag: false
          skip-github-pull-request: true

      - if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$(gh release view --json tagName,assets --jq 'select(all(.assets[]; .name != "checksums.txt")) | .tagName')"
          if [[ -n "$tag" ]]; then gh release edit "$tag" --draft=true; fi

      - id: version
        run: |
          git fetch --quiet --force --tags origin
          version="$(bash .github/scripts/next-release-version.sh https://github.com/router-for-me/CLIProxyAPI.git)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: googleapis/release-please-action@v5
        with:
          release-type: simple
          include-component-in-tag: false
          skip-github-release: true
          release-as: ${{ steps.version.outputs.version }}

  build-hosted:
    name: build ${{ matrix.target }}
    needs: release-please
    if: ${{ !cancelled() && (needs.release-please.outputs.created == 'true' || inputs.tag != '') }}
    env:
      TAG: ${{ needs.release-please.outputs.tag || inputs.tag }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-amd64
            runner: windows-latest
            goos: windows
            goarch: amd64
            asset_arch: amd64
            archive_format: zip
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Refresh models catalog
        shell: bash
        run: bash .github/scripts/refresh-model-catalogs.sh
      - name: Fetch tags
        shell: bash
        run: git fetch --force --tags
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-
            go-${{ runner.os }}-${{ runner.arch }}-
      - name: Generate Build Metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "RELEASE_VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Build archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
          ARCHIVE_FORMAT: ${{ matrix.archive_format }}
        run: |
          set -euo pipefail
          binary_name="cli-proxy-api"
          if [[ "$GOOS" == "windows" ]]; then
            binary_name="cli-proxy-api.exe"
          fi

          archive_dir="dist/${TARGET}/archive"
          archive_name="clepsydra-proxy_${RELEASE_VERSION}_${GOOS}_${ASSET_ARCH}.${ARCHIVE_FORMAT}"
          rm -rf "dist/${TARGET}"
          mkdir -p "$archive_dir"

          CGO_ENABLED=1 GOOS="$GOOS" GOARCH="$GOARCH" go build \
            -ldflags="-s -w -X main.Version=${RELEASE_VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
            -o "$archive_dir/$binary_name" ./cmd/server/

          cp LICENSE README.md README_CN.md config.example.yaml "$archive_dir/"
          if [[ "$ARCHIVE_FORMAT" == "zip" ]]; then
            powershell -NoProfile -Command "Compress-Archive -Path '${archive_dir}/*' -DestinationPath 'dist/${archive_name}' -Force"
          else
            tar -C "$archive_dir" -czf "dist/$archive_name" "$binary_name" LICENSE README.md README_CN.md config.example.yaml
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/clepsydra-proxy_*
          if-no-files-found: error

  build-linux-glibc:
    name: build linux-${{ matrix.goarch }} glibc
    needs: release-please
    if: ${{ !cancelled() && (needs.release-please.outputs.created == 'true' || inputs.tag != '') }}
    env:
      TAG: ${{ needs.release-please.outputs.tag || inputs.tag }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-latest
            goarch: amd64
            asset_arch: amd64
            manylinux_image: quay.io/pypa/manylinux2014_x86_64
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Refresh models catalog
        shell: bash
        run: bash .github/scripts/refresh-model-catalogs.sh
      - name: Fetch tags
        shell: bash
        run: git fetch --force --tags
      - name: Generate Build Metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "RELEASE_VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Build archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          GOARCH: ${{ matrix.goarch }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
          MANYLINUX_IMAGE: ${{ matrix.manylinux_image }}
        run: |
          set -euo pipefail

          archive_dir="dist/${TARGET}/archive"
          archive_name="clepsydra-proxy_${RELEASE_VERSION}_linux_${ASSET_ARCH}.tar.gz"
          rm -rf "dist/${TARGET}"
          mkdir -p "$archive_dir"

          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            -e GO_VERSION \
            -e GOARCH \
            -e RELEASE_VERSION \
            -e COMMIT \
            -e BUILD_DATE \
            "$MANYLINUX_IMAGE" \
            bash -euo pipefail -c '
              go_archive="go${GO_VERSION}.linux-${GOARCH}.tar.gz"
              curl -fsSL "https://go.dev/dl/${go_archive}" -o "/tmp/${go_archive}"
              rm -rf /usr/local/go
              tar -C /usr/local -xzf "/tmp/${go_archive}"
              export PATH="/usr/local/go/bin:${PATH}"

              CGO_ENABLED=1 GOOS=linux GOARCH="${GOARCH}" go build -buildvcs=false \
                -ldflags="-s -w -X main.Version=${RELEASE_VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
                -o "'"$archive_dir"'/cli-proxy-api" ./cmd/server/

              glibc_versions="$(readelf --version-info "'"$archive_dir"'/cli-proxy-api" | sed -n "s/.*Name: GLIBC_\([0-9.]*\).*/\1/p" | sort -Vu)"
              if [[ -n "${glibc_versions}" ]]; then
                printf "GLIBC versions:\n%s\n" "${glibc_versions}"
                max_glibc="$(printf "%s\n" "${glibc_versions}" | sort -V | tail -n 1)"
                if [[ "$(printf "2.17\n%s\n" "${max_glibc}" | sort -V | tail -n 1)" != "2.17" ]]; then
                  printf "linux ${GOARCH} binary requires GLIBC_%s, expected GLIBC_2.17 or older\n" "${max_glibc}" >&2
                  exit 1
                fi
              fi
            '

          cp LICENSE README.md README_CN.md config.example.yaml "$archive_dir/"
          tar -C "$archive_dir" -czf "dist/$archive_name" cli-proxy-api LICENSE README.md README_CN.md config.example.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/clepsydra-proxy_*
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && needs.build-hosted.result == 'success' && needs.build-linux-glibc.result == 'success' }}
    needs:
      - release-please
      - build-hosted
      - build-linux-glibc
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag || inputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish checksums and the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum clepsydra-proxy_*.tar.gz clepsydra-proxy_*.zip | sort -k2 > checksums.txt
          gh release upload "$TAG" clepsydra-proxy_*.tar.gz clepsydra-proxy_*.zip checksums.txt --clobber
          highest="$({ gh release list --exclude-drafts --limit 100 --json tagName --jq '.[].tagName'; echo "$TAG"; } | sort -V | tail -n 1)"
          gh release edit "$TAG" --draft=false --latest="$([[ "$highest" == "$TAG" ]] && echo true || echo false)"
